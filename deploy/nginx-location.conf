# Insert into an existing HTTPS server block with a phone-trusted certificate.
# Replace this example network with the actual trusted phone network/VPN.
location = /yealink_vv {
    allow 192.0.2.0/24;
    deny all;
    access_log off;
    proxy_pass http://127.0.0.1:5000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
location ^~ /yealink_vv/ {
    allow 192.0.2.0/24;
    deny all;
    access_log off;
    proxy_pass http://127.0.0.1:5000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

# Compact entry URL for the Yealink 99-character key-value limit.
location = /v {
    allow 192.0.2.0/24;
    deny all;
    access_log off;
    proxy_pass http://127.0.0.1:5000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
