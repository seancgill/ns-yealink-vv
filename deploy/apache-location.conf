# Insert into the existing HTTPS VirtualHost; requires mod_proxy and mod_proxy_http.
# Replace example network. Proxy only the app namespace, preserving its path.
<LocationMatch "^/(?:yealink_vv|v)(?:/|$)">
    Require ip 192.0.2.0/24
</LocationMatch>
ProxyPassMatch "^(/(?:yealink_vv|v)(?:/.*)?)$" "http://127.0.0.1:5000$1" connectiontimeout=5 timeout=15
ProxyPassReverse "/yealink_vv" "http://127.0.0.1:5000/yealink_vv"
SetEnvIf Request_URI "^/(?:yealink_vv|v)(?:/|$)" yealink_vv
# Edit EVERY applicable existing CustomLog to add env=!yealink_vv, for example:
# CustomLog /var/log/apache2/access.log combined env=!yealink_vv

ProxyPassReverse "/v" "http://127.0.0.1:5000/v"
